name: LocalFlow
options:
  bundleIdPrefix: com.kkeefer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
# Signing lives in an xcconfig so each developer can use their own team (or none) without
# editing tracked files. See Config/LocalFlow.xcconfig.
configFiles:
  Debug: Config/LocalFlow.xcconfig
  Release: Config/LocalFlow.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Never change this: macOS keys permission grants and the settings folder to it.
    PRODUCT_BUNDLE_IDENTIFIER: com.kkeefer.LocalFlow
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: "0.18.0"
targets:
  LocalFlow:
    type: application
    platform: macOS
    sources: [Sources/LocalFlow]
    info:
      path: Sources/LocalFlow/Info.plist
      properties:
        CFBundleName: LocalFlow
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSMicrophoneUsageDescription: "LocalFlow records your voice to transcribe it into text on-device."
    entitlements:
      path: Sources/LocalFlow/LocalFlow.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: true
        ENABLE_HARDENED_RUNTIME: true
        # Code signing is configured at the project level (Config/LocalFlow.xcconfig)
        # so the app and test bundle share one Team ID.
    dependencies:
      - package: WhisperKit
    scheme:
      testTargets: [LocalFlowTests]
  LocalFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LocalFlowTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LocalFlow
