name: LocalFlow
options:
  bundleIdPrefix: com.kkeefer
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.kkeefer.LocalFlow
    CODE_SIGN_STYLE: Automatic
    # Code signing — project-level so the app AND test bundle share one Team ID
    # (a signed app refuses to load an ad-hoc test bundle: "different Team IDs").
    # Setup per machine: Xcode → Settings → Accounts → add Apple ID → Manage
    # Certificates → + → Apple Development. Team ID = OU field of the cert.
    DEVELOPMENT_TEAM: GWXZQMSVDT
    CODE_SIGN_IDENTITY: "Apple Development"
packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: "0.18.0"
targets:
  LocalFlow:
    type: application
    platform: macOS
    sources: [Sources/LocalFlow]
    info:
      path: Sources/LocalFlow/Info.plist
      properties:
        CFBundleName: LocalFlow
        LSUIElement: true
        NSMicrophoneUsageDescription: "LocalFlow records your voice to transcribe it into text on-device."
    entitlements:
      path: Sources/LocalFlow/LocalFlow.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        INFOPLIST_KEY_LSUIElement: true
        ENABLE_HARDENED_RUNTIME: true
        # Code signing is configured at the project level (see top-level settings)
        # so the app and test bundle share one Team ID.
    dependencies:
      - package: WhisperKit
  LocalFlowTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LocalFlowTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LocalFlow
