name: Release

# Builds a signed LocalFlow.zip for a version tag and attaches it (plus a SHA-256 file) to a
# DRAFT GitHub Release for review before publishing. The signing mode follows the secrets:
#   - Developer ID secrets present -> Developer ID signed, notarized, stapled
#   - otherwise SELF_SIGNED_* present -> signed with the free self-signed certificate
# See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: build number = commit count; ancestry check below

      - name: Validate tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          marketing="${BASH_REMATCH[1]}"
          declared="$(awk -F'"' '/MARKETING_VERSION:/{print $2; exit}' project.yml)"
          if [[ "$declared" != "$marketing" ]]; then
            echo "::error::project.yml MARKETING_VERSION is '$declared' but the tag is $TAG. Bump project.yml, commit, then tag."; exit 1
          fi
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG does not point at a commit on main."; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          [[ "$TAG" == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

      - name: Choose signing mode
        id: mode
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          DEVELOPER_ID_TEAM: ${{ secrets.DEVELOPER_ID_TEAM }}
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          SELF_SIGNED_P12_BASE64: ${{ secrets.SELF_SIGNED_P12_BASE64 }}
          SELF_SIGNED_P12_PASSWORD: ${{ secrets.SELF_SIGNED_P12_PASSWORD }}
        run: |
          missing() { local m=(); for n in "$@"; do [[ -n "${!n}" ]] || m+=("$n"); done; echo "${m[*]}"; }
          dev_id=(DEVELOPER_ID_P12_BASE64 DEVELOPER_ID_P12_PASSWORD DEVELOPER_ID_TEAM
                  NOTARY_API_KEY_P8_BASE64 NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID)
          dev_missing="$(missing "${dev_id[@]}")"
          self_missing="$(missing SELF_SIGNED_P12_BASE64 SELF_SIGNED_P12_PASSWORD)"
          if [[ -z "$dev_missing" ]]; then
            echo "mode=notarized" >> "$GITHUB_OUTPUT"; echo "Signing mode: Developer ID + notarization"
          elif [[ -z "$self_missing" ]]; then
            if [[ "$dev_missing" != "${dev_id[*]}" ]]; then
              echo "::error::Some Developer ID secrets are set but these are missing: $dev_missing. Set all of them or none."; exit 1
            fi
            echo "mode=selfsigned" >> "$GITHUB_OUTPUT"; echo "Signing mode: self-signed (not notarized)"
          else
            echo "::error::No signing secrets. Set SELF_SIGNED_P12_BASE64 + SELF_SIGNED_P12_PASSWORD (free) or the Developer ID secrets. See docs/RELEASING.md."; exit 1
          fi

      - uses: ./.github/actions/setup-tools

      - name: Unit tests
        run: scripts/build.sh test

      - name: Import signing certificate into a temporary keychain
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          SELF_SIGNED_P12_BASE64: ${{ secrets.SELF_SIGNED_P12_BASE64 }}
          SELF_SIGNED_P12_PASSWORD: ${{ secrets.SELF_SIGNED_P12_PASSWORD }}
        run: |
          if [[ "$MODE" == "notarized" ]]; then
            p12_base64="$DEVELOPER_ID_P12_BASE64"; p12_password="$DEVELOPER_ID_P12_PASSWORD"
          else
            p12_base64="$SELF_SIGNED_P12_BASE64"; p12_password="$SELF_SIGNED_P12_PASSWORD"
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$p12_base64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$p12_password" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          # Prepend to the search list so xcodebuild/codesign can find the identity.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Write notarization API key
        if: steps.mode.outputs.mode == 'notarized'
        env:
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.NOTARY_API_KEY_P8_BASE64 }}
        run: |
          echo "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          echo "NOTARY_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Build, sign, (notarize, staple,) verify, package
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          DEVELOPER_ID_TEAM: ${{ secrets.DEVELOPER_ID_TEAM }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$MODE" == "selfsigned" ]]; then
            scripts/release.sh "$VERSION" --self-signed
          else
            scripts/release.sh "$VERSION"
          fi

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          flags=(--draft --verify-tag --generate-notes --title "LocalFlow $VERSION")
          [[ "$PRERELEASE" == "true" ]] && flags+=(--prerelease)
          if [[ "$MODE" == "selfsigned" ]]; then
            # Shown above the generated changelog.
            flags+=(--notes "$(cat .github/release-notes-self-signed.md)")
          fi
          gh release create "$TAG" "${flags[@]}" \
            "dist/LocalFlow-$VERSION.zip" "dist/LocalFlow-$VERSION.zip.sha256"

      - name: Remove signing material
        if: always()
        run: |
          [[ -n "${SIGNING_KEYCHAIN:-}" ]] && security delete-keychain "$SIGNING_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/signing.p12"
