name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-tools

      - name: Shell script syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Unit tests
        run: scripts/build.sh test

      - name: Release build (ad-hoc signed)
        run: scripts/build.sh release

      # Exercises the self-signed release path (scripts/create-signing-cert.sh + release.sh
      # --self-signed) with a throwaway certificate, set up the same way release.yml does.
      - name: Self-signed release check (throwaway certificate)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          scripts/create-signing-cert.sh "$RUNNER_TEMP/selfsign"
          keychain="$RUNNER_TEMP/selfsign.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/selfsign/LocalFlow-Self-Signed.p12" -k "$keychain" \
            -P "$(cat "$RUNNER_TEMP/selfsign/p12-password.txt")" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          before="$(security list-keychains -d user)"

          SIGNING_KEYCHAIN="$keychain" scripts/release.sh "0.0.0-ci.$BUILD_NUMBER" --self-signed

          app=build/release/export/LocalFlow.app
          codesign -dvv "$app" 2>&1 | grep "Authority=LocalFlow Self-Signed"
          codesign -d -r- "$app" 2>&1 | grep "certificate leaf"
          test "$(security list-keychains -d user)" = "$before" || { echo "::error::release.sh did not restore the keychain search list"; exit 1; }
          # Throwaway certificate: never let this zip reach an uploaded artifact.
          rm -f "dist/LocalFlow-0.0.0-ci.$BUILD_NUMBER.zip" "dist/LocalFlow-0.0.0-ci.$BUILD_NUMBER.zip.sha256"

      - name: Remove throwaway signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/selfsign.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/selfsign"

      - name: Package unsigned test build
        if: github.event_name == 'push'
        env:
          BUILD_NUMBER: ${{ github.run_number }} # shallow clone: commit count would always be 1
        run: scripts/release.sh "0.0.0-ci.${{ github.run_number }}" --unsigned

      - name: Upload unsigned test build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Not signed with Developer ID or notarized: Gatekeeper blocks it on other Macs.
          # For maintainers testing a main build only — never link this as a release.
          name: LocalFlow-unsigned-${{ github.sha }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
